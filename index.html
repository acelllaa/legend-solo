<style>

<script>
'use strict';
const $=id=>document.getElementById(id);
const T=48,R=Math.random,rr=(a,b)=>a+R()*(b-a),ri=(a,b)=>Math.floor(rr(a,b+1)),cl=(v,a,b)=>v<a?a:v>b?b:v;
const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const cv=$("cv");let cx=cv.getContext("2d");
let W=0,H=0,DPR=1,ZM=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR|0;cv.height=H*DPR|0;ZM=cl(H/420,0.8,1.6);}
addEventListener('resize',resize);resize();
// ---------------- data ----------------
const CLS={
 war:{n:'战士',col:'#b33',d:'近战高血高防\n攻杀·刺杀·烈火·冲撞',hp:[100,30],mp:[20,3],atk:[5,2.2],mag:[0,0],tao:[0,0],def:[2,.9],mdef:[1,.5],main:'atk'},
 mag:{n:'法师',col:'#36c',d:'远程魔法爆发\n火球·抗拒·雷电·魔法盾',hp:[70,15],mp:[50,12],atk:[3,.8],mag:[5,2.6],tao:[0,0],def:[1,.5],mdef:[2,.8],main:'mag'},
 tao:{n:'道士',col:'#3a6',d:'治疗召唤持续伤害\n治愈·施毒·火符·骷髅',hp:[85,22],mp:[35,8],atk:[4,1.2],mag:[0,0],tao:[4,2],def:[2,.7],mdef:[2,.7],main:'tao'}};
const SK={
 war:[{id:'gs',n:'攻杀',lv:2,mp:5,cd:3},{id:'cs',n:'刺杀',lv:5,mp:6,cd:2},{id:'lh',n:'烈火',lv:10,mp:12,cd:8},{id:'ym',n:'冲撞',lv:14,mp:10,cd:6}],
 mag:[{id:'hq',n:'火球',lv:1,mp:4,cd:.6},{id:'kj',n:'抗拒',lv:5,mp:8,cd:4},{id:'ld',n:'雷电',lv:8,mp:10,cd:1.2},{id:'md',n:'魔盾',lv:12,mp:20,cd:20}],
 tao:[{id:'zy',n:'治愈',lv:1,mp:6,cd:3},{id:'sd',n:'施毒',lv:3,mp:6,cd:4},{id:'hf',n:'火符',lv:6,mp:6,cd:.8},{id:'kl',n:'骷髅',lv:9,mp:25,cd:10}]};
const MON={
 chick:{n:'鸡',lv:1,c:'#eee',s:'bird',z:14,sp:50,pas:1},
 deer:{n:'鹿',lv:2,c:'#b8823a',s:'deer',z:18,sp:70,pas:1},
 scare:{n:'稻草人',lv:3,c:'#c9a24f',s:'scare',z:18,sp:45},
 cat:{n:'钉耙猫',lv:5,c:'#7a6a5a',s:'cat',z:17,sp:75},
 skel:{n:'骷髅',lv:8,c:'#ddd8c8',s:'skel',z:18,sp:65},
 skwar:{n:'骷髅战将',lv:11,c:'#c8b890',s:'skel',z:21,sp:70},
 skelf:{n:'骷髅精灵',lv:14,c:'#f0e8ff',s:'skel',z:26,sp:75,el:1},
 cent:{n:'百足虫',lv:14,c:'#a33',s:'bug',z:20,sp:70},
 pincer:{n:'钳虫',lv:16,c:'#5a6a2a',s:'bug',z:22,sp:65},
 bee:{n:'跳跳蜂',lv:15,c:'#e8c020',s:'bee',z:15,sp:95},
 boar:{n:'黑野猪',lv:18,c:'#333',s:'boar',z:24,sp:80,el:1},
 guard:{n:'沃码卫士',lv:20,c:'#8a6a2a',s:'guard',z:22,sp:75},
 boss:{n:'沃码教主',lv:26,c:'#a07a20',s:'boss',z:40,sp:70,boss:1}};
const MAPS=[
 {n:'比齐城',w:32,h:22,th:'town',safe:1,sp:[16,13],npc:[16,9],po:[{x:30,y:11,to:1,tx:2,ty:18}],pk:[]},
 {n:'比齐野外',w:52,h:36,th:'grass',sp:[3,18],po:[{x:1,y:18,to:0,tx:28,ty:11},{x:50,y:18,to:2,tx:3,ty:16}],pk:[['chick',6,10,9],['deer',5,18,27],['scare',5,32,9],['cat',6,40,27],['chick',4,25,18]]},
 {n:'骷髅窟',w:46,h:32,th:'cave',sp:[3,16],po:[{x:1,y:16,to:1,tx:48,ty:18},{x:44,y:16,to:3,tx:3,ty:16}],pk:[['skel',6,12,8],['skel',6,13,24],['skwar',5,28,8],['skwar',5,29,24],['skelf',1,37,16]]},
 {n:'百足洞',w:46,h:32,th:'bug',sp:[3,16],po:[{x:1,y:16,to:2,tx:42,ty:16},{x:44,y:16,to:4,tx:3,ty:12}],pk:[['cent',6,12,8],['bee',5,13,24],['pincer',5,27,8],['pincer',4,28,24],['boar',2,37,16]]},
 {n:'沃码神殿',w:30,h:24,th:'temple',sp:[3,12],po:[{x:1,y:12,to:3,tx:42,ty:16}],pk:[['guard',3,12,6],['guard',3,12,18],['boss',1,23,12]]}];
const Q=[{n:'普通',m:1,c:'#eee'},{n:'精良',m:1.35,c:'#6cf06c'},{n:'稀有',m:1.8,c:'#5ab0ff'},{n:'传说',m:2.5,c:'#ff9b2a'}];
const SLOTS={weapon:'武器',armor:'衣服',helmet:'头盔',neck:'项链',br1:'手镯',br2:'手镯',rg1:'戒指',rg2:'戒指'};
const INAME={
 weapon:{atk:['木剑','青铜斧','八荒','炼域','裁绝之杖'],mag:['桃木杖','海魂','偃月','骨玉法杖','龙纹法杖'],tao:['青铜剑','半月','降妖','无极杖','龙文剑']},
 armor:['布衣','轻型盔甲','重型盔甲','战神铠','天魔神铠'],helmet:['青铜盔','铁盔','骷髅盔','圣战盔','祖码盔'],
 neck:['金项链','传统项链','灯笼项链','绿玉项链','圣战项链'],br:['铁手镯','银手镯','坚固手套','魔力手镯','圣战手镯'],rg:['古铜戒指','珊瑚戒指','黑铁戒指','骷髅戒指','力量戒指']};
const SHOP=[{k:'hp1',n:'金创药(小)',p:20,hp:80},{k:'hp2',n:'金创药(中)',p:90,hp:300},{k:'mp1',n:'魔法药(小)',p:20,mp:80},{k:'mp2',n:'魔法药(中)',p:90,mp:300}];
// ---------------- state ----------------
let P=null,S=null,map=null,mons=[],drops=[],fx=[],proj=[],pets=[],texts=[],gtime=0,mapI=0,bossCD={},running=false;
function newSave(cls){return{cls,lv:1,exp:0,gold:100,map:0,x:0,y:0,inv:[],eq:{},pots:{hp1:5,mp1:5,hp2:0,mp2:0},bossKills:0};}
function needExp(lv){return Math.round(40*Math.pow(lv,1.8));}
function calc(){const c=CLS[S.cls],L=S.lv,st={};for(const k of['hp','mp','atk','mag','tao','def','mdef'])st[k]=Math.round(c[k][0]+c[k][1]*L);
 for(const s in S.eq){const it=S.eq[s];if(it)for(const k in it.st)st[k]+=it.st[k];}
 P.st=st;P.mhp=st.hp;P.mmp=st.mp;P.hp=Math.min(P.hp??st.hp,st.hp);P.mp=Math.min(P.mp??st.mp,st.mp);}
function save(){if(!S)return;S.map=mapI;S.x=P.x;S.y=P.y;S.hp=P.hp;S.mp=P.mp;try{localStorage.setItem('bqcs_save1',JSON.stringify(S));}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem('bqcs_save1'));}catch(e){return null;}}
// ---------------- items ----------------
let uid=1;
function mkItem(slot,tier,q,kind){const t=cl(tier,0,4),m=Q[q].m,f=t+1,st={};kind=kind||['atk','mag','tao'][ri(0,2)];let n;
 if(slot==='weapon'){n=INAME.weapon[kind][t];st[kind]=Math.round(f*5*m);if(kind!=='atk')st.atk=Math.round(f*1.5*m);}
 else if(slot==='armor'){n=INAME.armor[t];st.def=Math.round(f*3.2*m);st.mdef=Math.round(f*2*m);}
 else if(slot==='helmet'){n=INAME.helmet[t];st.def=Math.round(f*1.6*m);st.mdef=Math.round(f*1*m);}
 else if(slot==='neck'){n=INAME.neck[t];st[kind]=Math.round(f*2.2*m);}
 else if(slot==='br'){n=INAME.br[t];st[kind]=Math.round(f*1.2*m);st.def=Math.round(f*1*m);}
 else {n=INAME.rg[t];st[kind]=Math.round(f*2*m);}
 if(q>=2)st.hp=Math.round(f*12*(q-1));if(q===3)st.mp=f*10;
 return{id:uid++,slot,t,q,kind,n,st,price:Math.round((t+1)*(t+1)*15*m*m)};}
function rollItem(mlv,boost){const slot=['weapon','armor','helmet','neck','br','br','rg','rg'][ri(0,7)];const t=cl(Math.floor((mlv-1)/5.5)+(R()<.15?1:0),0,4);
 let r=R()*100,q=r<2+boost*4?3:r<10+boost*14?2:r<35+boost*20?1:0;if(boost>=2)q=Math.max(q,2);
 const kind=R()<.6?CLS[S.cls].main:['atk','mag','tao'][ri(0,2)];return mkItem(slot,t,q,kind);}
const STN={atk:'攻击',mag:'魔法',tao:'道术',def:'防御',mdef:'魔防',hp:'生命',mp:'魔力'};
function itemDesc(it){return Object.entries(it.st).map(([k,v])=>STN[k]+' +'+v).join('<br>');}
function eqSlotFor(it){if(it.slot==='br')return !S.eq.br1?'br1':!S.eq.br2?'br2':'br1';if(it.slot==='rg')return !S.eq.rg1?'rg1':!S.eq.rg2?'rg2':'rg1';return it.slot;}
function equip(it){const s=eqSlotFor(it),old=S.eq[s];S.inv=S.inv.filter(x=>x!==it);S.eq[s]=it;if(old)S.inv.push(old);calc();msg('装备了 <span style="color:'+Q[it.q].c+'">'+it.n+'</span>');save();}
function unequip(s){if(S.inv.length>=40){msg('背包已满');return;}S.inv.push(S.eq[s]);delete S.eq[s];calc();save();}
// ---------------- map ----------------
function srand(s){return()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};}
const THEME={town:['#6b5a3e','#5e4f36','#7a6848'],grass:['#4a6a2a','#3f5e24','#567a32'],cave:['#3a332c','#332c26','#443b33'],bug:['#3a2a22','#33241c','#4a3428'],temple:['#4a3a2a','#3e3020','#5a4630']};
function buildMap(i){const m=MAPS[i];if(m.solid)return m;const w=m.w,h=m.h,s=new Uint8Array(w*h),rnd=srand(i*977+13);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(x===0||y===0||x===w-1||y===h-1)s[y*w+x]=1;
 const clear=[[m.sp[0],m.sp[1]],...m.po.map(p=>[p.x,p.y]),...m.pk.map(p=>[p[2],p[3]])];if(m.npc)clear.push(m.npc);
 const ok=(x,y)=>clear.every(c=>Math.abs(c[0]-x)>2||Math.abs(c[1]-y)>2);
 if(m.th==='town'){for(const [hx,hy,hw,hh] of [[3,3,6,4],[22,3,6,4],[3,15,6,4],[22,15,6,4],[13,3,6,3]])for(let y=hy;y<hy+hh;y++)for(let x=hx;x<hx+hw;x++)s[y*w+x]=2;}
 else{const n=Math.floor(w*h*(m.th==='temple'?.03:.06));for(let k=0;k<n;k++){const x=1+Math.floor(rnd()*(w-2)),y=1+Math.floor(rnd()*(h-2));if(ok(x,y)){s[y*w+x]=1;if(rnd()<.5&&ok(x+1,y)&&x+1<w-1)s[y*w+x+1]=1;}}}
 for(const p of m.po){for(const [dx,dy] of [[0,0],[1,0],[-1,0]]){const x=p.x+dx;if(x>0&&x<w-1)s[p.y*w+x]=0;}}
 m.solid=s;
 // prerender ground
 const g=document.createElement('canvas');g.width=w*T;g.height=h*T;const c=g.getContext('2d'),pal=THEME[m.th];
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){c.fillStyle=pal[Math.floor(rnd()*3)];c.fillRect(x*T,y*T,T,T);

  case'die':cx.fillStyle=f.c;for(let j=0;j<6;j++){const a=j/6*6.28;cx.fillRect(f.x+Math.cos(a)*k*f.z*1.5,f.y-f.z+Math.sin(a)*k*f.z,4,4);}break;
  case'dash':cx.fillStyle='#fff6';cx.beginPath();cx.ellipse(f.x,f.y,30,10,0,0,7);cx.fill();break;
  case'spark':cx.fillStyle=f.c;cx.fillRect(f.x-2,f.y-2,4,4);break;}cx.globalAlpha=1;}
 cx.textAlign='center';for(const t of texts){cx.globalAlpha=Math.min(1,t.life*2);cx.font=(t.big?'bold 20px':'bold 14px')+' sans-serif';cx.fillStyle='#000';cx.fillText(t.t,t.x+1,t.y+1);cx.fillStyle=t.c;cx.fillText(t.t,t.x,t.y);}cx.globalAlpha=1;
 cx.setTransform(DPR,0,0,DPR,0,0);
 const b=mons.find(m=>m.boss&&!m.dead&&m.st==='chase');if(b){const w=Math.min(360,W*.45);cx.fillStyle='#000a';cx.fillRect(W/2-w/2,50,w,12);cx.fillStyle='#d42';cx.fillRect(W/2-w/2,50,w*b.hp/b.mhp,12);cx.strokeStyle='#d9b45a';cx.strokeRect(W/2-w/2,50,w,12);cx.font='bold 12px sans-serif';cx.fillStyle='#fff';cx.fillText(b.n+'  '+Math.max(0,Math.ceil(b.hp))+'/'+b.mhp,W/2,60);}
 hudTick();}
let hudLast=0;
function hudTick(){const now=performance.now();if(now-hudLast<100)return;hudLast=now;
 $('lvl').textContent=CLS[S.cls].n+'  Lv.'+S.lv+'   坐标 '+Math.floor(P.x/T)+':'+Math.floor(P.y/T);
 $('hpb').firstChild.style.width=(P.hp/P.mhp*100)+'%';$('hpb').lastChild.textContent='HP '+Math.ceil(P.hp)+'/'+P.mhp;
 $('mpb').firstChild.style.width=(P.mp/P.mmp*100)+'%';$('mpb').lastChild.textContent='MP '+Math.ceil(P.mp)+'/'+P.mmp;
 $('expb').firstChild.style.width=(S.exp/needExp(S.lv)*100)+'%';$('gold').textContent='金币 '+S.gold;updCtl();}
// ---------------- controls ----------------
function buildCtl(){const c=$('ctl');c.innerHTML='';const a=document.createElement('div');a.className='sk';a.id='atk';a.textContent='攻击';c.appendChild(a);
 const on=(el,f,up)=>{el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();f();});if(up){for(const ev of['pointerup','pointercancel','pointerleave'])el.addEventListener(ev,e=>{up();});}};
 on(a,()=>{holdAtk=true;basicAttack();},()=>holdAtk=false);
 const pos=[[128,28],[112,112],[42,128],[200,140]];SK[S.cls].forEach((s,i)=>{const b=document.createElement('div');b.className='sk';b.id='sk'+i;b.style.cssText=`width:60px;height:60px;right:${pos[i][0]}px;bottom:${pos[i][1]}px`;b.innerHTML=s.n+'<small>Lv'+s.lv+'</small><div class="cd"></div>';on(b,()=>useSkill(i));c.appendChild(b);});
 [['hp','红药',230,30],['mp','蓝药',230,90]].forEach(([t,n,r,bt])=>{const b=document.createElement('div');b.className='sk';b.id='pot'+t;b.style.cssText=`width:52px;height:52px;right:${r}px;bottom:${bt}px;border-color:${t==='hp'?'#f66':'#69f'}`;b.innerHTML=n+'<small></small>';on(b,()=>usePot(t));c.appendChild(b);});
 $('ctl').style.width='300px';updCtl();}
function updCtl(){if(!S)return;SK[S.cls].forEach((s,i)=>{const b=$('sk'+i);if(!b)return;b.classList.toggle('dis',S.lv<s.lv||P.mp<s.mp);const cd=P.cds[s.id]||0;b.lastChild.style.height=(cd/s.cd*100)+'%';b.lastChild.style.top='auto';b.lastChild.style.bottom='0';});
 for(const t of['hp','mp']){const b=$('pot'+t);if(b)b.querySelector('small').textContent='x'+(S.pots[t+'1']+S.pots[t+'2']);}}
cv.addEventListener('pointerdown',e=>{if(joy.on||!running)return;if(e.clientX>W*.55)return;joy={on:true,id:e.pointerId,bx:e.clientX,by:e.clientY,x:0,y:0};const j=$('joy');j.style.left=(e.clientX-60)+'px';j.style.top=(e.clientY-60)+'px';j.style.bottom='auto';});
addEventListener('pointermove',e=>{if(!joy.on||e.pointerId!==joy.id)return;let dx=e.clientX-joy.bx,dy=e.clientY-joy.by;const l=Math.hypot(dx,dy),mx=50;if(l>mx){dx*=mx/l;dy*=mx/l;}joy.x=dx/mx;joy.y=dy/mx;$('joy').firstChild.style.transform=`translate(${dx}px,${dy}px)`;});
const joyEnd=e=>{if(e.pointerId!==joy.id)return;joy={on:false,id:null,x:0,y:0};$('joy').firstChild.style.transform='';};addEventListener('pointerup',joyEnd);addEventListener('pointercancel',joyEnd);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(!running)return;if(k==='k')useSkill(0);if(k==='l')useSkill(1);if(k==='u')useSkill(2);if(k==='i')useSkill(3);if(k==='q')usePot('hp');if(k==='e')usePot('mp');if(k==='b')toggleBag();if(k==='f'&&nearNpc())openShop();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0;});
// ---------------- UI panels ----------------
function nearNpc(){return map&&map.npc&&Math.hypot(P.x-(map.npc[0]+.5)*T,P.y-(map.npc[1]+.5)*T)<110;}
function updateNpcBtn(){$('npcb').classList.toggle('hide',!nearNpc()||!$('shop').classList.contains('hide'));}
$('npcb').onclick=()=>openShop();
function closeAll(){for(const id of['bag','tip','shop'])$(id).classList.add('hide');shopMode=false;}
let shopMode=false;
function toggleBag(){if(!$('bag').classList.contains('hide')){closeAll();return;}closeAll();renderBag();$('bag').classList.remove('hide');}
$('bBag').onclick=toggleBag;$('bagX').onclick=closeAll;
function iconCanvas(it){const c=document.createElement('canvas');c.width=c.height=80;drawItemIcon(c.getContext('2d'),it,80);return c;}
function renderBag(){const e=$('eqp');e.innerHTML='';const lay={helmet:[0,0],neck:[0,56],weapon:[0,112],br1:[0,168],rg1:[0,224],armor:[194,0],br2:[194,168],rg2:[194,224]};
 for(const s in lay){const d=document.createElement('div');d.className='slot';d.style.left=lay[s][0]+'px';d.style.top=lay[s][1]+'px';const it=S.eq[s];if(it){d.appendChild(iconCanvas(it));d.style.borderColor=Q[it.q].c;d.onclick=()=>showTip(it,s);}else d.textContent=SLOTS[s];e.appendChild(d);}
 const st=document.createElement('div');st.id='stats';const p=P.st;st.innerHTML=`<b style="color:#ffd36a">${CLS[S.cls].n} Lv.${S.lv}</b><br>生命 ${P.mhp}<br>魔力 ${P.mmp}<br>攻击 ${p.atk}<br>魔法 ${p.mag}<br>道术 ${p.tao}<br>防御 ${p.def}<br>魔防 ${p.mdef}<br>经验 ${S.exp}/${needExp(S.lv)}<br><span style="color:#ffd36a">金币 ${S.gold}</span><br>背包 ${S.inv.length}/40`;e.appendChild(st);
 const g=$('grid');g.innerHTML='';if(shopMode){const h=document.createElement('div');h.style.cssText='grid-column:1/-1;color:#ffd36a;font-size:13px';h.textContent='出售模式：点击物品出售';g.appendChild(h);}
 S.inv.forEach(it=>{const d=document.createElement('div');d.className='slot';d.style.borderColor=Q[it.q].c;d.appendChild(iconCanvas(it));d.onclick=()=>showTip(it);g.appendChild(d);});}
function showTip(it,eqs){const t=$('tip');const cur=!eqs&&S.eq[eqSlotFor(it)];t.innerHTML=`<div style="color:${Q[it.q].c};font-weight:bold">[${Q[it.q].n}] ${it.n}</div><div style="color:#bfa77a">${SLOTS[eqSlotFor(it)]} · ${it.t+1}阶</div>${itemDesc(it)}${cur?'<div style="color:#888;margin-top:4px;font-size:12px">当前：'+cur.n+'<br>'+itemDesc(cur)+'</div>':''}<div class="row"></div>`;
 const row=t.querySelector('.row');const B=(n,c,f)=>{const b=document.createElement('button');b.className='btn '+c;b.textContent=n;b.onclick=()=>{f();t.classList.add('hide');renderBag();};row.appendChild(b);};
 if(eqs)B('卸下','',()=>unequip(eqs));else{B('装备','g',()=>equip(it));if(shopMode||nearNpc())B('出售 '+it.price+'金','',()=>sell(it));else B('丢弃','r',()=>{S.inv=S.inv.filter(x=>x!==it);});}
 B('取消','',()=>{});t.style.left='50%';t.style.top='50%';t.style.transform='translate(-50%,-50%)';t.classList.remove('hide');}
function sell(it){S.inv=S.inv.filter(x=>x!==it);S.gold+=it.price;msg('出售 '+it.n+' 获得 '+it.price+' 金币');save();}
function openShop(){closeAll();const s=$('shop');shopMode=true;s.innerHTML='<b style="color:#ffd36a;font-size:18px">药店掌柜</b><div style="font-size:12px;color:#bfa77a;margin:4px 0 8px">“少侠，出城打怪前多备些药。装备免修理，随便用！”</div><div id="shopl"></div><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn" id="sSell">出售背包物品</button><button class="btn" id="sJunk">一键出售普通/精良</button><button class="btn r" id="sX">离开</button></div>';
 const L=$('shopl');const draw=()=>{L.innerHTML='<div style="color:#ffd36a">金币：'+S.gold+'</div>';SHOP.forEach(p=>{const d=document.createElement('div');d.className='it';d.innerHTML=`<span style="color:${potCol[p.k]}">■</span><span>${p.n}（回复${p.hp||p.mp}）持有 ${S.pots[p.k]}</span><span style="flex:none;color:#ffd36a">${p.p}金</span>`;
  for(const n of[1,10]){const b=document.createElement('button');b.className='btn g';b.textContent='买'+n;b.onclick=()=>{if(S.gold<p.p*n){msg('金币不足');return;}S.gold-=p.p*n;S.pots[p.k]+=n;draw();updCtl();save();};d.appendChild(b);}L.appendChild(d);});};draw();
 $('sSell').onclick=()=>{s.classList.add('hide');renderBag();$('bag').classList.remove('hide');};
 $('sJunk').onclick=()=>{let g=0,n=0;S.inv=S.inv.filter(it=>{if(it.q<=1){g+=it.price;n++;return false;}return true;});S.gold+=g;msg('出售 '+n+' 件，获得 '+g+' 金币');draw();save();};
 $('sX').onclick=closeAll;s.classList.remove('hide');updateNpcBtn();}
$('bHome').onclick=()=>{if(!running)return;closeAll();if(mapI===0)return;msg('使用回城');enterMap(0);};
$('bFs').onclick=goFull;$('bRev').onclick=revive;
function goFull(){const d=document.documentElement;try{(d.requestFullscreen||d.webkitRequestFullscreen).call(d).then?.(()=>screen.orientation?.lock?.('landscape').catch(()=>{})).catch(()=>{});}catch(e){}}

  d.appendChild(cvs);d.insertAdjacentHTML('beforeend','<b>'+CLS[k].n+'</b><small>'+CLS[k].d.replace('\n','<br>')+'</small>');d.onclick=()=>{selCls=k;buildTitle();};c.appendChild(d);
  // draw preview using main draw fn on temp ctx

 const sv=load();$('bCont').classList.toggle('hide',!sv);if(sv)$('bCont').textContent='继续游戏（'+CLS[sv.cls].n+' Lv.'+sv.lv+'）';}

function cxSwap(g){cxRef=g;}
let cxRef=null;
function start(sv){goFull();S=sv;newPlayer();if(sv.hp)P.hp=Math.min(sv.hp,P.mhp);if(sv.mp)P.mp=Math.min(sv.mp,P.mmp);
 for(const it of[...S.inv,...Object.values(S.eq)])uid=Math.max(uid,it.id+1);$('title').classList.add('hide');buildCtl();running=true;enterMap(S.map||0,S.map?Math.floor(S.x/T):undefined,S.map?Math.floor(S.y/T):undefined);
 if(!sv.tut){sv.tut=1;setTimeout(()=>msg('左侧拖动移动，按住「攻击」自动寻敌；走到传送阵切换地图'),600);}}
